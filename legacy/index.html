<!--
  Anti-FOUC: the saved theme, density, locale direction and motion preference are
  applied before the stylesheet paints. Kept inline (no module, no import) so it
  runs synchronously in the head. Fails closed to the dark crimson theme.
-->
<script>
  (function () {
    var root = document.documentElement;
    var prefs = {};
    try {
      prefs = JSON.parse(localStorage.getItem('redget:prefs:v4') || '{}') || {};
    } catch (error) { prefs = {}; }
    var theme = prefs.theme || 'dark';
    var group = (theme === 'light' || theme === 'contrast-light') ? 'light' : 'dark';
    root.setAttribute('data-theme', theme);
    root.setAttribute('data-theme-group', group);
    root.style.colorScheme = group;
    if (prefs.density) root.setAttribute('data-density', prefs.density);
    if (prefs.reducedMotion) root.setAttribute('data-reduced-motion', 'true');
    if (prefs.locale) root.setAttribute('lang', prefs.locale);
    if (prefs.locale === 'ar' || prefs.locale === 'he') root.setAttribute('dir', 'rtl');
    root.setAttribute('data-boot', 'pending');
  })();
</script>

<!-- The app shell (header, main#app, footer, toasts) is built by src/app.js. -->

<script type="module">
  import { bootstrap } from '/src/app.js';

  bootstrap(document.body).catch((error) => {
    console.error('[RedGet] boot failed', error);
    var main = document.getElementById('app');
    if (main) {
      main.innerHTML =
        '<div class="container error-container"><div class="error-card">' +
        '<p class="error-code">500</p>' +
        '<h1 class="error-title">RedGet could not start</h1>' +
        '<p class="error-description">' +
        'The application shell failed to initialise. In most cases this is stale ' +
        'demo data left over from an older schema version.</p>' +
        '<div class="error-actions">' +
        '<button class="btn btn-primary" type="button" id="redget-reset">Clear demo data and reload</button>' +
        '<a class="btn" href="/docs">Read the docs</a>' +
        '</div></div></div>';
      var button = document.getElementById('redget-reset');
      if (button) {
        button.addEventListener('click', function () {
          try {
            Object.keys(localStorage)
              .filter(function (key) { return key.indexOf('redget:') === 0; })
              .forEach(function (key) { localStorage.removeItem(key); });
          } catch (storageError) { /* storage may be unavailable */ }
          window.location.reload();
        });
      }
    }
    document.documentElement.setAttribute('data-boot', 'failed');
  });
</script>
